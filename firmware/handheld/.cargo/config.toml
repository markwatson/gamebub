[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# Every placement flag is passed explicitly: espflash v4 ignores the `[idf]`
# section of espflash.toml, and without `--target-app-partition` it invents its
# own partition table and writes the app over the `dfu` partition at 0x10000.
# `--monitor` is deliberately absent: it reconnects with a flash stub after
# flashing, which undoes the reset and leaves the device in download mode, and
# the console is on UART0 so it has nothing to show anyway. See FLASHING.md.
runner = "espflash flash --chip esp32s3 --bootloader bootloader.bin --partition-table partitions.csv --target-app-partition factory"
rustflags = [
    "--cfg",
    "espidf_time64",
] # Extending time_t for ESP IDF 5: https://github.com/esp-rs/rust/issues/110

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.4.3"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
CARGO_WORKSPACE_DIR = { value = "", relative = true }
# Needed on macOS: https://github.com/esp-rs/esp-idf-template/issues/174
CRATE_CC_NO_DEFAULTS = "1"
